name: ML Pipeline CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: day5/requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r day5/requirements-ci.txt

      - name: Lint with flake8
        run: |
          flake8 day5/演習3 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 day5/演習3 --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Check formatting with Black
        run: black --check day5/演習3

      - name: Run data tests
        run: pytest day5/演習3/tests/test_data.py -v

      - name: Run model tests
        run: pytest day5/演習3/tests/test_model.py day5/演習3/tests/test_saved_model.py -v
